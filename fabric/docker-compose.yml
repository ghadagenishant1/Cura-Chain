version: '2'

services:
  orderer.hospitalnetwork.com:
    container_name: orderer.hospitalnetwork.com
    image: hyperledger/fabric-orderer:latest
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
    ports:
      - "7050:7050"
    volumes:
      - ../fabric/config/:/var/hyperledger/orderer
    command: orderer

  peer0.org1.hospitalnetwork.com:
    container_name: peer0.org1.hospitalnetwork.com
    image: hyperledger/fabric-peer:latest
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.org1.hospitalnetwork.com
      - CORE_PEER_ADDRESS=peer0.org1.hospitalnetwork.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_LOCALMSPDIR=/var/hyperledger/peer/msp
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.hospitalnetwork.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.hospitalnetwork.com:7051
    ports:
      - "7051:7051"
      - "7053:7053"
    volumes:
      - ../fabric/config/:/var/hyperledger/config
    command: peer node start
    depends_on:
      - orderer.hospitalnetwork.com

  cli:
    container_name: fabric-cli
    image: hyperledger/fabric-tools:latest
    environment:
      - FABRIC_CFG_PATH=/var/hyperledger/config
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_ADDRESS=peer0.org1.hospitalnetwork.com:7051
    volumes:
      - ../fabric/config/:/var/hyperledger/config
    command: /bin/bash
    stdin_open: true
    tty: true
    depends_on:
      - peer0.org1.hospitalnetwork.com
